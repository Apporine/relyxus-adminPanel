name: CD

# Builds the Admin Web once per commit on develop and main and publishes the bundle with
# build provenance, so later promotion moves the same tested artifact (spec §35).
# Container image build and environment deployment are added in a later release.

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  bundle:
    name: Build release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Package standalone bundle
        working-directory: apps/admin_web
        run: |
          cp -r .next/static .next/standalone/apps/admin_web/.next/static
          cp -r public .next/standalone/apps/admin_web/public
          tar -czf "$GITHUB_WORKSPACE/admin-web-${GITHUB_SHA}.tar.gz" -C .next/standalone .
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: admin-web-${{ github.sha }}.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: admin-web-${{ github.sha }}
          path: admin-web-${{ github.sha }}.tar.gz
          retention-days: 30
